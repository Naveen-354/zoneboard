[package]
name = "zoneboard"
version = "0.2.0"
edition = "2024"
description = "Live crypto + NSE order-block scanner, chart, journal and backtest"
license = "MIT"
default-run = "zoneboard"

# Three programs share one library:
#   zoneboard            the desktop window (needs the `desktop` feature, on by default)
#   zoneboard-server     the same server for a normal browser tab, no webview needed
#   zoneboard-backtest   backtest the rule on Binance or NSE history
[[bin]]
name = "zoneboard"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "zoneboard-server"
path = "src/bin/zoneboard-server.rs"

[[bin]]
name = "zoneboard-backtest"
path = "src/bin/zoneboard-backtest.rs"

[features]
default = ["desktop"]
# `cargo build --no-default-features` builds only the server and the backtest, without Tauri.
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = "0.8"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tauri = { version = "2", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
